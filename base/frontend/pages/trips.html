<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tìm chuyến xe | BusGo</title>
  <link rel="icon" href="../assets/images/logo.svg">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/booking-flow.css">
</head>
<body data-root="../">
  <header id="app-header"></header>

  <main class="container">
    <nav class="breadcrumbs" aria-label="Điều hướng">
      <a href="../index.html">Trang chủ</a><span>›</span><span>Tìm chuyến xe</span>
    </nav>

    <div class="list-header" style="margin-bottom: 16px;">
      <div>
        <span class="eyebrow">LỰA CHỌN HÀNH TRÌNH</span>
        <h1 style="margin-bottom: 4px;">Tìm chuyến xe phù hợp</h1>
        <p class="muted" style="margin: 0;">So sánh giờ khởi hành, giá vé và số ghế còn trống theo thời gian thực.</p>
      </div>
      <a class="btn" href="../index.html">← Quay lại trang chủ</a>
    </div>

    <section class="card">
      <form id="trip-search-form">
        <div class="trip-search-fields">
          <div class="control-group">
            <label for="origin">Điểm đi *</label>
            <input id="origin" name="origin" type="text" required placeholder="VD: Hà Nội, Mỹ Đình...">
          </div>
          <div class="control-group">
            <label for="destination">Điểm đến *</label>
            <input id="destination" name="destination" type="text" required placeholder="VD: Hải Phòng, Đà Nẵng...">
          </div>
          <div class="control-group">
            <label for="travel-date">Ngày khởi hành *</label>
            <input id="travel-date" name="travel_date" type="date" required>
          </div>
          <button id="search-submit" class="btn btn-accent" type="submit">Tìm chuyến →</button>
        </div>

        <details class="trip-filters" open>
          <summary>Bộ lọc nâng cao (Giá vé · Khung giờ · Sắp xếp)</summary>
          <div class="trip-search-fields trip-search-fields-optional">
            <div class="control-group">
              <label for="min-price">Giá thấp nhất (₫)</label>
              <input id="min-price" name="min_price" type="number" min="0" step="10000" placeholder="0">
            </div>
            <div class="control-group">
              <label for="max-price">Giá cao nhất (₫)</label>
              <input id="max-price" name="max_price" type="number" min="0" step="10000" placeholder="Không giới hạn">
            </div>
            <div class="control-group">
              <label for="time-from">Khởi hành từ</label>
              <input id="time-from" name="time_from" type="time">
            </div>
            <div class="control-group">
              <label for="time-to">Khởi hành đến</label>
              <input id="time-to" name="time_to" type="time">
            </div>
            <div class="control-group">
              <label for="sort">Sắp xếp theo</label>
              <select id="sort" name="sort" style="width:100%;padding:8px 10px;border:1px solid var(--color-border);border-radius:var(--radius);">
                <option value="departure_asc">Giờ đi: sớm nhất</option>
                <option value="departure_desc">Giờ đi: muộn nhất</option>
                <option value="price_asc">Giá: thấp đến cao</option>
                <option value="price_desc">Giá: cao đến thấp</option>
              </select>
            </div>
          </div>
        </details>
        <p id="search-feedback" class="text-error" hidden style="margin-top: 10px;"></p>
      </form>
    </section>

    <section>
      <div class="list-header">
        <div>
          <h2 style="margin-bottom: 2px;">Kết quả chuyến xe</h2>
          <p id="trip-results-status" class="muted" style="margin: 0;">Nhập thông tin hành trình để tìm chuyến còn ghế.</p>
        </div>
      </div>
      <div id="trip-results" class="trip-results"></div>
    </section>
  </main>

  <footer id="app-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/trips.js"></script>
</body>
</html>
