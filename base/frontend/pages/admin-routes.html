<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý tuyến đường - BusGo Admin</title>
  <link rel="icon" href="../assets/images/logo.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: { brand: { 50: '#FFF7ED', 100: '#FFEDD5', 500: '#F97316', 600: '#EA580C', 700: '#C2410C' } }
        }
      }
    };
  </script>
</head>
<body data-root="../" class="bg-[#F8FAFC] text-slate-800 font-sans antialiased min-h-screen flex">

  <!-- Unified Admin Sidebar -->
  <aside id="admin-sidebar"></aside>

  <!-- Main Workspace -->
  <div class="flex-1 flex flex-col min-w-0">
    <header
      id="admin-topbar"
      data-title="Quản lý tuyến đường & Bến xe"
      data-action-html='<div class="flex items-center gap-2"><button type="button" id="btn-new-station" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-sm font-semibold transition"><span class="material-symbols-outlined text-[19px]">location_on</span>Thêm bến xe</button><button type="button" id="btn-new-route" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-sm font-semibold shadow-xs transition"><span class="material-symbols-outlined text-[19px]">add</span>Thêm tuyến mới</button></div>'
    ></header>

    <main class="flex-1 p-4 sm:p-8 max-w-7xl w-full mx-auto space-y-5">
      <!-- Search Bar -->
      <div class="bg-white border border-slate-200 rounded-xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-xs">
        <div class="relative w-full sm:w-96">
          <span class="material-symbols-outlined text-slate-400 text-[19px] absolute left-3 top-1/2 -translate-y-1/2">search</span>
          <input id="route-search" type="text" placeholder="Tìm mã tuyến, bến đi, bến đến..." class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:border-brand-500" />
        </div>
        <div class="text-xs text-slate-500">
          Tổng số tuyến đang hiển thị: <strong id="route-total-count" class="text-slate-900">0</strong>
        </div>
      </div>

      <!-- Routes Table -->
      <div class="bg-white border border-slate-200 rounded-xl shadow-xs overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm text-left">
            <thead class="bg-slate-50 text-slate-500 text-xs uppercase border-b border-slate-200">
              <tr>
                <th class="px-5 py-3.5 font-semibold">Mã tuyến</th>
                <th class="px-5 py-3.5 font-semibold">Bến xuất phát</th>
                <th class="px-5 py-3.5 font-semibold">Bến đến</th>
                <th class="px-5 py-3.5 font-semibold">Cự ly</th>
                <th class="px-5 py-3.5 font-semibold">Thời gian chạy</th>
                <th class="px-5 py-3.5 font-semibold">Giá cơ bản</th>
                <th class="px-5 py-3.5 font-semibold">Trạng thái</th>
                <th class="px-5 py-3.5 font-semibold text-right">Thao tác</th>
              </tr>
            </thead>
            <tbody id="routes-tbody" class="divide-y divide-slate-100">
              <tr><td colspan="8" class="px-5 py-8 text-center text-slate-400">Đang tải danh sách tuyến đường...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Create/Edit Route Modal -->
  <div id="route-modal" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl border border-slate-200">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
        <h3 id="route-modal-title" class="font-display font-bold text-lg text-slate-900">Thêm tuyến đường mới</h3>
        <button type="button" id="btn-close-route-modal" class="text-slate-400 hover:text-slate-600">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <form id="route-form" class="space-y-4">
        <input type="hidden" id="edit-route-id" />

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Mã tuyến * (VD: HN-DN)</label>
            <input id="input-code" type="text" required maxlength="20" placeholder="HN-DN" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm uppercase focus:outline-none focus:border-brand-500" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Trạng thái</label>
            <select id="input-active" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm bg-white focus:outline-none focus:border-brand-500">
              <option value="true">Đang hoạt động</option>
              <option value="false">Ngừng hoạt động</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Bến xuất phát *</label>
            <select id="input-departure" required class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm bg-white focus:outline-none focus:border-brand-500">
              <option value="">-- Chọn bến đi --</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Bến đến *</label>
            <select id="input-arrival" required class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm bg-white focus:outline-none focus:border-brand-500">
              <option value="">-- Chọn bến đến --</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Khoảng cách (km) *</label>
            <input id="input-distance" type="number" min="1" step="0.1" required placeholder="760" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Thời gian chạy (phút) *</label>
            <input id="input-duration" type="number" min="1" required placeholder="840" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Giá cơ bản (VNĐ) *</label>
            <input id="input-base-price" type="number" min="0" step="1000" required placeholder="450000" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500" />
          </div>
        </div>

        <div class="pt-3 border-t border-slate-100 flex justify-end gap-2.5">
          <button type="button" id="btn-cancel-route" class="px-4 py-2 rounded-xl border border-slate-200 hover:bg-slate-50 text-sm font-medium text-slate-700">Hủy</button>
          <button type="submit" id="btn-save-route" class="px-5 py-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-sm font-semibold transition">Lưu tuyến đường</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Quick Create Station Modal -->
  <div id="station-modal" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-200">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
        <h3 class="font-display font-bold text-lg text-slate-900">Thêm bến xe mới</h3>
        <button type="button" id="btn-close-station-modal" class="text-slate-400 hover:text-slate-600">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <form id="station-form" class="space-y-3.5">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Tên bến xe *</label>
          <input id="st-name" type="text" required placeholder="VD: Bến xe Mỹ Đình" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Tỉnh / Thành phố *</label>
          <input id="st-city" type="text" required placeholder="VD: Hà Nội" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Địa chỉ chi tiết</label>
          <input id="st-address" type="text" placeholder="VD: 20 Phạm Hùng, Nam Từ Liêm, Hà Nội" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-500" />
        </div>
        <div class="pt-3 border-t border-slate-100 flex justify-end gap-2.5">
          <button type="button" id="btn-cancel-station" class="px-4 py-2 rounded-xl border border-slate-200 hover:bg-slate-50 text-sm font-medium text-slate-700">Hủy</button>
          <button type="submit" id="btn-save-station" class="px-5 py-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-sm font-semibold transition">Lưu bến xe</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin-layout.js"></script>
  <script src="../js/pages/admin-routes.js"></script>
</body>
</html>
