<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loại xe & Sơ đồ ghế | BusGo Admin</title>
  <link rel="icon" href="../assets/images/logo.svg">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/bus-types.css">
</head>
<body data-root="../">
  <header id="app-header"></header>

  <main class="container">
    <section class="card">
      <h1>Quản lý loại xe &amp; sơ đồ ghế</h1>
      <p class="muted">Thêm loại xe → tự sinh ghế. Bấm <strong>Sơ đồ</strong> để xem trước. Cần Admin.</p>

      <div class="layout-split">
        <div>
          <h2 id="form-title">Thêm loại xe mới</h2>
          <form id="bt-form">
            <label>Tên cấu hình *</label>
            <input name="name" required maxlength="100" placeholder="VD: Giường nằm 40 chỗ">

            <label>Số tầng *</label>
            <select name="floors" required>
              <option value="1">1 tầng</option>
              <option value="2">2 tầng</option>
            </select>

            <label>Số hàng / tầng *</label>
            <input name="rows_per_floor" type="number" min="1" value="10" required>

            <label>Số cột / tầng *</label>
            <input name="cols_per_floor" type="number" min="1" max="6" value="2" required>

            <label>Loại chỗ</label>
            <select name="seat_type">
              <option value="berth">Giường nằm</option>
              <option value="seat">Ghế ngồi</option>
            </select>

            <label>Mô tả</label>
            <input name="description" maxlength="255">

            <div class="form-actions">
              <button type="submit" class="btn btn-primary" id="btn-submit">Thêm</button>
              <button type="button" class="btn" id="btn-cancel" hidden>Huỷ</button>
            </div>
          </form>
        </div>

        <div>
          <div class="list-header">
            <h2>Danh sách loại xe</h2>
            <input id="search-input" type="search" placeholder="Tìm tên loại xe...">
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Tên</th>
                  <th>Tầng</th>
                  <th>Chỗ</th>
                  <th>TT</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="table-body"></tbody>
            </table>
          </div>
          <div class="pager" id="pager"></div>

          <div id="seat-preview" class="seat-preview" hidden>
            <div class="list-header">
              <h2 id="seat-title">Sơ đồ ghế</h2>
              <button type="button" class="btn btn-small" id="seat-close">Đóng</button>
            </div>
            <div id="seat-map" class="seat-map"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="app-footer"></footer>

  <div class="modal-backdrop" id="confirm-modal">
    <div class="modal">
      <h3 id="confirm-title">Xác nhận</h3>
      <p id="confirm-message" class="muted"></p>
      <div class="modal-actions">
        <button type="button" class="btn" id="confirm-cancel">Huỷ</button>
        <button type="button" class="btn btn-danger-solid" id="confirm-ok">Xác nhận</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/bus-types.js"></script>
</body>
</html>
