<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập | BusGo</title>
  <link rel="icon" href="../assets/images/logo.svg">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-root="../">
  <header id="app-header"></header>

  <main class="container">
    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <h1>Đăng nhập BusGo</h1>
          <p>Quản lý vé đặt, giữ ghế nhanh và theo dõi hành trình của bạn</p>
        </div>

        <div id="login-alert" class="status"></div>

        <form id="login-form" novalidate>
          <div>
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="nhapemail@gmail.com"
              autocomplete="email"
              required
            >
          </div>

          <div>
            <label for="password">Mật khẩu</label>
            <div class="input-password-wrap">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Nhập mật khẩu"
                autocomplete="current-password"
                required
              >
              <button type="button" class="btn-toggle-pass" id="toggle-password">Hiện</button>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" id="btn-submit" class="btn btn-primary btn-block">
              Đăng nhập
            </button>
          </div>
        </form>

        <div class="auth-footer">
          Chưa có tài khoản BusGo? <a href="register.html"><strong>Đăng ký ngay</strong></a>
        </div>
      </div>
    </div>
  </main>

  <footer id="app-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/login.js"></script>
</body>
</html>
